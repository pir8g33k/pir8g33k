<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-label="Stack and frameworks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Stack and frameworks</title><style>
  .sans{font-family:Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, 'JetBrains Mono', 'Cascadia Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .sweep{transform-origin:0 0;animation:spin 7s linear infinite}
  .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
  .p2{animation-delay:.8s} .p3{animation-delay:1.6s}
  .blink{animation:blink 1.6s steps(2) infinite}
  .caret{animation:blink 1.1s steps(2) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
  @keyframes blink{50%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.sweep,.ping,.blink,.caret{animation:none}}
