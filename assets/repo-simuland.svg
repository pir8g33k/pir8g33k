<text class="sans" font-size="14.5" fill="#8b94a3"><tspan x="24" y="88">Fork of Microsoft&#x27;s SimuLand: lab environments</tspan><tspan x="24" y="109">that reproduce real attack techniques to test</tspan><tspan x="24" y="130">Defender and Sentinel detections.</tspan></text><g transform="translate(24 152)"><rect width="126" height="24" rx="12" fill="#0f1216" stroke="#2a313c"/><circle cx="13" cy="12" r="4" fill="#0078d4" stroke="#2a313c"/><text x="23" y="16.5" class="mono" font-size="11.5" fill="#e7e9ec">ARM templates</text></g><g transform="translate(158.2 152)"><rect width="89" height="24" rx="12" fill="#0f1216" stroke="#2a313c"/><circle cx="13" cy="12" r="4" fill="#5cc8ff" stroke="#2a313c"/><text x="23" y="16.5" class="mono" font-size="11.5" fill="#e7e9ec">Sentinel</text></g><g transform="translate(255.39999999999998 152)"><rect width="119" height="24" rx="12" fill="#0f1216" stroke="#2a313c"/><circle cx="13" cy="12" r="4" fill="#ff3b30" stroke="#2a313c"/><text x="23" y="16.5" class="mono" font-size="11.5" fill="#e7e9ec">MITRE ATT&amp;CK</text></g><text x="566" y="168.5" text-anchor="end" class="mono" font-size="10.5" fill="#5d6573" letter-spacing="2">FIG. 03.4</text></svg>
